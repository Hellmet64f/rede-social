<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rede Social - Compartilhe Tudo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 999;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      max-width: 400px;
      width: 90%;
    }
    .modal-content h3 {
      margin-top: 0;
      color: #333;
    }
    .modal-content input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .modal-content button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-confirm {
      background: #667eea;
      color: white;
    }
    .btn-confirm:hover {
      background: #764ba2;
    }
    .btn-cancel {
      background: #f0f0f0;
      color: #333;
    }
    .btn-cancel:hover {
      background: #e0e0e0;
    }
  </style>
</head>
<body>
  <!-- Modal de Login -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-content">
      <h3>🔗 Digite seu Usuário GitHub</h3>
      <input type="text" id="usernameInput" placeholder="ex: Hellmet64f" autocomplete="off">
      <button class="btn-confirm" id="confirmLoginBtn" onclick="handleLoginConfirm()">Entrar</button>
      <button class="btn-cancel" id="cancelLoginBtn" onclick="handleLoginCancel()">Cancelar</button>
    </div>
  </div>

  <!-- Página de Login -->
  <div id="loginPage" class="page-container">
    <div class="login-container">
      <div class="login-box">
        <h1>🚀 Rede Social</h1>
        <p>Compartilhe vídeos, fotos e textos com seus amigos</p>
        <button class="btn-github" id="loginBtn" onclick="showLoginModal()">🔗 Entrar com GitHub</button>
        <p class="info-text">Digite seu nome de usuário do GitHub para continuar</p>
      </div>
    </div>
  </div>

  <!-- Página do Dashboard -->
  <div id="dashboardPage" class="page-container hidden">
    <nav class="navbar">
      <div class="navbar-container">
        <h2 class="logo">📱 Rede Social</h2>
        <div class="user-info">
          <img id="userAvatar" src="" alt="Avatar" class="avatar">
          <span id="username"></span>
          <button id="logoutBtn" class="btn-logout" onclick="handleLogout()">Sair</button>
        </div>
      </div>
    </nav>
    <div class="dashboard-container">
      <!-- Formulário de Postagem -->
      <div class="post-form-container">
        <div class="form-header">
          <img id="userAvatarForm" src="" alt="Avatar" class="avatar-small">
          <textarea id="postContent" placeholder="O que você quer compartilhar?" maxlength="500" onkeyup="updateCharCount()"></textarea>
        </div>
        <div class="form-actions">
          <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;" onchange="handleFileSelect()">
          <button class="btn-upload" id="uploadBtn" onclick="document.getElementById('fileInput').click()">📎 Anexar Mídia</button>
          <span id="charCount">0/500</span>
          <button id="postBtn" class="btn-primary" onclick="handlePostSubmit()">Postar</button>
        </div>
        <div id="filePreview" class="file-preview hidden"></div>
      </div>

      <!-- Feed de Posts -->
      <div id="feedContainer" class="feed-container">
        <div class="loading">Carregando postagens...</div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://api.github.com';
    let currentUser = null;
    let posts = [];
    let selectedFile = null;

    function showLoginModal() {
      document.getElementById('loginModal').classList.add('active');
      document.getElementById('usernameInput').focus();
    }

    function handleLoginCancel() {
      document.getElementById('loginModal').classList.remove('active');
      document.getElementById('usernameInput').value = '';
    }

    function handleLoginConfirm() {
      const username = document.getElementById('usernameInput').value.trim();
      if (!username) {
        alert('Por favor, digite um nome de usuário válido');
        return;
      }
      authenticateUser(username);
    }

    async function authenticateUser(username) {
      try {
        const response = await fetch(`${API_URL}/users/${encodeURIComponent(username)}`);
        if (!response.ok) throw new Error('Usuário não encontrado');
        
        const user = await response.json();
        currentUser = {
          id: user.id,
          login: user.login,
          name: user.name || user.login,
          avatar_url: user.avatar_url,
          bio: user.bio,
          followers: user.followers,
          following: user.following,
          public_repos: user.public_repos
        };
        
        localStorage.setItem('github_user', JSON.stringify(currentUser));
        document.getElementById('loginModal').classList.remove('active');
        showDashboard();
        loadPosts();
      } catch (error) {
        alert('Erro: ' + error.message);
      }
    }

    function checkAuthStatus() {
      const user = localStorage.getItem('github_user');
      if (user) {
        try {
          currentUser = JSON.parse(user);
          showDashboard();
          loadPosts();
        } catch (e) {
          localStorage.removeItem('github_user');
          showLogin();
        }
      } else {
        showLogin();
      }
    }

    function showLogin() {
      document.getElementById('loginPage').classList.remove('hidden');
      document.getElementById('dashboardPage').classList.add('hidden');
    }

    function showDashboard() {
      document.getElementById('loginPage').classList.add('hidden');
      document.getElementById('dashboardPage').classList.remove('hidden');
      if (currentUser) {
        document.getElementById('username').textContent = currentUser.login;
        document.getElementById('userAvatar').src = currentUser.avatar_url;
        document.getElementById('userAvatarForm').src = currentUser.avatar_url;
      }
    }

    function handleLogout() {
      localStorage.removeItem('github_user');
      currentUser = null;
      posts = [];
      document.getElementById('feedContainer').innerHTML = '';
      showLogin();
    }

    function updateCharCount() {
      const count = document.getElementById('postContent').value.length;
      document.getElementById('charCount').textContent = `${count}/500`;
    }

    function handleFileSelect() {
      const fileInput = document.getElementById('fileInput');
      selectedFile = fileInput.files[0];
      if (selectedFile) showFilePreview();
    }

    function showFilePreview() {
      const preview = document.getElementById('filePreview');
      preview.classList.remove('hidden');
      preview.innerHTML = '';
      
      if (selectedFile.type.startsWith('image/')) {
        const img = document.createElement('img');
        const reader = new FileReader();
        reader.onload = (e) => { img.src = e.target.result; };
        reader.readAsDataURL(selectedFile);
        preview.appendChild(img);
      }
      
      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove-file';
      removeBtn.textContent = '✗';
      removeBtn.onclick = () => {
        selectedFile = null;
        document.getElementById('fileInput').value = '';
        preview.classList.add('hidden');
      };
      preview.appendChild(removeBtn);
    }

    async function handlePostSubmit() {
      const content = document.getElementById('postContent').value.trim();
      if (!content && !selectedFile) {
        alert('Escreva algo ou anexe uma mídia!');
        return;
      }

      let fileUrl = null;
      if (selectedFile) {
        fileUrl = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.readAsDataURL(selectedFile);
        });
      }

      const post = {
        id: Date.now(),
        username: currentUser.login,
        avatar: currentUser.avatar_url,
        content: content,
        fileUrl: fileUrl,
        timestamp: new Date().toISOString(),
        likes: 0,
        comments: []
      };

      posts.unshift(post);
      localStorage.setItem('posts', JSON.stringify(posts));
      
      document.getElementById('postContent').value = '';
      updateCharCount();
      selectedFile = null;
      document.getElementById('fileInput').value = '';
      document.getElementById('filePreview').classList.add('hidden');
      
      displayPosts();
    }

    function loadPosts() {
      const saved = localStorage.getItem('posts');
      posts = saved ? JSON.parse(saved) : [];
      displayPosts();
    }

    function displayPosts() {
      const container = document.getElementById('feedContainer');
      container.innerHTML = '';
      if (posts.length === 0) {
        container.innerHTML = '<div class="loading">Nenhuma postagem ainda. Seja o primeiro a postar!</div>';
        return;
      }
      posts.forEach(post => container.appendChild(createPostElement(post)));
    }

    function createPostElement(post) {
      const div = document.createElement('div');
      div.className = 'post';
      
      const date = new Date(post.timestamp).toLocaleDateString('pt-BR') + ' ' + new Date(post.timestamp).toLocaleTimeString('pt-BR');
      
      let html = `
        <div class="post-header">
          <img src="${post.avatar}" alt="Avatar" class="avatar">
          <div class="post-header-info">
            <h3>${escapeHtml(post.username)}</h3>
            <time>${date}</time>
          </div>
        </div>
        <div class="post-content">
          <p>${escapeHtml(post.content)}</p>
      `;
      
      if (post.fileUrl && post.fileUrl.startsWith('data:image')) {
        html += `<img src="${post.fileUrl}" alt="Imagem" class="post-media">`;
      }
      
      html += `
        </div>
        <div class="post-footer">
          <button class="post-action like-btn" onclick="handleLike(${post.id})">💙 <span class="likes-count">${post.likes}</span></button>
        </div>
      `;
      
      div.innerHTML = html;
      return div;
    }

    function handleLike(postId) {
      const post = posts.find(p => p.id === postId);
      if (post) {
        post.likes++;
        localStorage.setItem('posts', JSON.stringify(posts));
        displayPosts();
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Inicializar
    window.addEventListener('DOMContentLoaded', () => {
      checkAuthStatus();
      // Permitir Enter para confirmar login
      document.getElementById('usernameInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleLoginConfirm();
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rede Social - Compartilhe Tudo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-btn {
      background: #333;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      text-decoration: none;
      display: inline-block;
      transition: background 0.3s;
    }
    .login-btn:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <!-- Página de Login -->
  <div id="loginPage" class="page-container">
    <div class="login-container">
      <div class="login-box">
        <h1>🚀 Rede Social</h1>
        <p>Compartilhe vídeos, fotos e textos com seus amigos</p>
        <button class="login-btn" id="loginBtn">🔗 Entrar com GitHub</button>
        <p class="info-text">Digite seu nome de usuário do GitHub para continuar</p>
      </div>
    </div>
  </div>

  <!-- Página do Dashboard -->
  <div id="dashboardPage" class="page-container hidden">
    <nav class="navbar">
      <div class="navbar-container">
        <h2 class="logo">📱 Rede Social</h2>
        <div class="user-info">
          <img id="userAvatar" src="" alt="Avatar" class="avatar">
          <span id="username"></span>
          <button id="logoutBtn" class="btn-logout">Sair</button>
        </div>
      </div>
    </nav>
    <div class="dashboard-container">
      <!-- Formulário de Postagem -->
      <div class="post-form-container">
        <div class="form-header">
          <img id="userAvatarForm" src="" alt="Avatar" class="avatar-small">
          <textarea id="postContent" placeholder="O que você quer compartilhar?" maxlength="500"></textarea>
        </div>
        <div class="form-actions">
          <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;">
          <button class="btn-upload" id="uploadBtn">📎 Anexar Mídia</button>
          <span id="charCount">0/500</span>
          <button id="postBtn" class="btn-primary">Postar</button>
        </div>
        <div id="filePreview" class="file-preview hidden"></div>
      </div>

      <!-- Feed de Posts -->
      <div id="feedContainer" class="feed-container">
        <div class="loading">Carregando postagens...</div>
      </div>
    </div>
  </div>

  <script>
    // ===== CONFIGURAÇÕES INICIAIS =====
    const API_URL = 'https://api.github.com';
    let currentUser = null;
    let posts = [];
    let selectedFile = null;

    // ===== ELEMENTOS DO DOM =====
    const loginPage = document.getElementById('loginPage');
    const dashboardPage = document.getElementById('dashboardPage');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const postBtn = document.getElementById('postBtn');
    const uploadBtn = document.getElementById('uploadBtn');
    const postContent = document.getElementById('postContent');
    const charCount = document.getElementById('charCount');
    const fileInput = document.getElementById('fileInput');
    const filePreview = document.getElementById('filePreview');
    const feedContainer = document.getElementById('feedContainer');
    const userAvatar = document.getElementById('userAvatar');
    const userAvatarForm = document.getElementById('userAvatarForm');
    const username = document.getElementById('username');

    // ===== INICIALIZAÇÃO =====
    window.addEventListener('load', () => {
      checkAuthStatus();
      setupEventListeners();
    });

    // ===== AUTENTICAÇÃO =====
    function checkAuthStatus() {
      const user = localStorage.getItem('github_user');
      if (user) {
        try {
          currentUser = JSON.parse(user);
          showDashboard();
          loadPosts();
        } catch (e) {
          localStorage.removeItem('github_user');
          showLogin();
        }
      } else {
        showLogin();
      }
    }

    function showLogin() {
      loginPage.classList.remove('hidden');
      dashboardPage.classList.add('hidden');
    }

    function showDashboard() {
      loginPage.classList.add('hidden');
      dashboardPage.classList.remove('hidden');
      if (currentUser) {
        username.textContent = currentUser.login || currentUser.name;
        userAvatar.src = currentUser.avatar_url || 'https://via.placeholder.com/40';
        userAvatarForm.src = currentUser.avatar_url || 'https://via.placeholder.com/40';
      }
    }

    loginBtn.addEventListener('click', async () => {
      const githubUsername = prompt('Digite seu nome de usuário do GitHub:');
      if (!githubUsername) return;

      try {
        const response = await fetch(`${API_URL}/users/${encodeURIComponent(githubUsername)}`);
        if (!response.ok) throw new Error('Usuário não encontrado');
        
        const user = await response.json();
        currentUser = {
          id: user.id,
          login: user.login,
          name: user.name || user.login,
          avatar_url: user.avatar_url,
          bio: user.bio,
          followers: user.followers,
          following: user.following,
          public_repos: user.public_repos
        };
        
        localStorage.setItem('github_user', JSON.stringify(currentUser));
        showDashboard();
        loadPosts();
      } catch (error) {
        alert('Erro ao autenticar: ' + error.message);
      }
    });

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('github_user');
      currentUser = null;
      posts = [];
      feedContainer.innerHTML = '';
      showLogin();
    });

    // ===== POSTS =====
    function setupEventListeners() {
      postBtn.addEventListener('click', handlePostSubmit);
      uploadBtn.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', handleFileSelect);
      postContent.addEventListener('input', (e) => {
        charCount.textContent = `${e.target.value.length}/500`;
      });
    }

    function handleFileSelect(e) {
      selectedFile = e.target.files[0];
      if (selectedFile) showFilePreview();
    }

    function showFilePreview() {
      filePreview.classList.remove('hidden');
      filePreview.innerHTML = '';
      
      if (selectedFile.type.startsWith('image/')) {
        const img = document.createElement('img');
        const reader = new FileReader();
        reader.onload = (e) => { img.src = e.target.result; };
        reader.readAsDataURL(selectedFile);
        filePreview.appendChild(img);
      } else if (selectedFile.type.startsWith('video/')) {
        const video = document.createElement('video');
        video.controls = true;
        const reader = new FileReader();
        reader.onload = (e) => { video.src = e.target.result; };
        reader.readAsDataURL(selectedFile);
        filePreview.appendChild(video);
      }
      
      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove-file';
      removeBtn.textContent = '✗';
      removeBtn.onclick = () => {
        selectedFile = null;
        fileInput.value = '';
        filePreview.classList.add('hidden');
      };
      filePreview.appendChild(removeBtn);
    }

    async function handlePostSubmit() {
      const content = postContent.value.trim();
      if (!content && !selectedFile) {
        alert('Escreva algo ou anexe uma mídia!');
        return;
      }

      let fileUrl = null;
      if (selectedFile) {
        fileUrl = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.readAsDataURL(selectedFile);
        });
      }

      const post = {
        id: Date.now(),
        username: currentUser.login,
        avatar: currentUser.avatar_url,
        content: content,
        fileUrl: fileUrl,
        timestamp: new Date().toISOString(),
        likes: 0,
        comments: []
      };

      posts.unshift(post);
      localStorage.setItem('posts', JSON.stringify(posts));
      
      postContent.value = '';
      charCount.textContent = '0/500';
      selectedFile = null;
      fileInput.value = '';
      filePreview.classList.add('hidden');
      
      displayPosts();
    }

    function loadPosts() {
      const saved = localStorage.getItem('posts');
      posts = saved ? JSON.parse(saved) : [];
      displayPosts();
    }

    function displayPosts() {
      feedContainer.innerHTML = '';
      if (posts.length === 0) {
        feedContainer.innerHTML = '<div class="loading">Nenhuma postagem ainda. Seja o primeiro a postar!</div>';
        return;
      }
      posts.forEach(post => feedContainer.appendChild(createPostElement(post)));
    }

    function createPostElement(post) {
      const div = document.createElement('div');
      div.className = 'post';
      
      const header = `
        <div class="post-header">
          <img src="${post.avatar}" alt="Avatar" class="avatar">
          <div class="post-header-info">
            <h3>${escapeHtml(post.username)}</h3>
            <time>${new Date(post.timestamp).toLocaleString('pt-BR')}</time>
          </div>
        </div>
      `;

      let content = `<div class="post-content"><p class="post-text">${escapeHtml(post.content)}</p>`;
      if (post.fileUrl) {
        if (post.fileUrl.startsWith('data:image')) {
          content += `<img src="${post.fileUrl}" alt="Imagem" class="post-media">`;
        } else if (post.fileUrl.startsWith('data:video')) {
          content += `<video controls class="post-media"><source src="${post.fileUrl}"></video>`;
        }
      }
      content += '</div>';

      const footer = `
        <div class="post-footer">
          <button class="post-action like-btn" data-post-id="${post.id}">💙 <span class="likes-count">${post.likes}</span></button>
          <button class="post-action comment-btn" data-post-id="${post.id}">💬 ${post.comments.length}</button>
        </div>
      `;

      div.innerHTML = header + content + footer;
      
      const likeBtn = div.querySelector('.like-btn');
      likeBtn.addEventListener('click', () => handleLike(post.id, likeBtn));
      
      return div;
    }

    function handleLike(postId, button) {
      const post = posts.find(p => p.id === postId);
      if (post) {
        post.likes++;
        button.querySelector('.likes-count').textContent = post.likes;
        localStorage.setItem('posts', JSON.stringify(posts));
        button.classList.add('liked');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>

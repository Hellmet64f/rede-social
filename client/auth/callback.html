<!DOCTYPE html>
<html>
<head>
    <title>GitHub Auth Callback</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
        .loading {
            text-align: center;
            color: white;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
        <p>Autenticando com GitHub...</p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');

        if (code) {
            localStorage.setItem('github_code', code);
            
            // Prompt for GitHub username
            setTimeout(() => {
                const username = prompt('Digite seu nome de usuário do GitHub:');
                
                if (username) {
                    // Fetch user data from GitHub public API
                    fetch(`https://api.github.com/users/${username}`)
                        .then(response => response.json())
                        .then(data => {
                            if (data.login) {
                                localStorage.setItem('github_user', JSON.stringify(data));
                                window.location.href = '/rede-social/client/';
                            } else {
                                alert('Usuário não encontrado!');
                                window.location.href = '/rede-social/client/';
                            }
                        })
                        .catch(() => {
                            alert('Erro ao autenticar');
                            window.location.href = '/rede-social/client/';
                        });
                } else {
                    window.location.href = '/rede-social/client/';
                }
            }, 500);
        } else {
            window.location.href = '/rede-social/client/';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autenticação GitHub - Rede Social</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    }

    .container {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      max-width: 400px;
      width: 90%;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #f0f0f0;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      color: #333;
      margin: 16px 0;
      font-size: 24px;
    }

    .message {
      color: #666;
      font-size: 16px;
      margin: 12px 0;
      line-height: 1.5;
    }

    .error {
      color: #dc3545;
      background: #f8d7da;
      padding: 12px;
      border-radius: 8px;
      margin-top: 20px;
      display: none;
    }

    .error.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Autenticando...</h1>
    <p class="message">Processando sua autenticação com GitHub</p>
    <div class="error" id="errorMessage"></div>
  </div>

  <script>
    (async function() {
      try {
        // Obter parâmetro 'code' da URL
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');

        if (!code) {
          throw new Error('Nenhum código de autorização recebido');
        }

        // Salvar informações temporariamente
        localStorage.setItem('github_code', code);
        if (state) {
          localStorage.setItem('github_state', state);
        }

        // Aguardar um pouco para garantir que o DOM está pronto
        await new Promise(resolve => setTimeout(resolve, 800));

        // Solicitar nome de usuário do GitHub
        const username = prompt('Digite seu nome de usuário do GitHub para continuar:');

        if (!username) {
          localStorage.removeItem('github_code');
          localStorage.removeItem('github_state');
          window.location.href = '/';
          return;
        }

        // Atualizar mensagem
        document.querySelector('.message').textContent = `Obtendo dados de ${username}...`;

        // Buscar dados públicos do usuário no GitHub
        const response = await fetch(`https://api.github.com/users/${encodeURIComponent(username)}`, {
          headers: {
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!response.ok) {
          throw new Error('Usuário não encontrado no GitHub');
        }

        const userData = await response.json();

        // Validar dados essenciais
        if (!userData.login || !userData.id) {
          throw new Error('Dados de usuário inválidos');
        }

        // Armazenar dados do usuário
        localStorage.setItem('github_user', JSON.stringify({
          id: userData.id,
          login: userData.login,
          name: userData.name || userData.login,
          avatar_url: userData.avatar_url,
          bio: userData.bio,
          location: userData.location,
          blog: userData.blog,
          public_repos: userData.public_repos,
          followers: userData.followers,
          following: userData.following,
          created_at: userData.created_at
        }));

        // Redirecionar para a página principal
        document.querySelector('.message').textContent = 'Redirecionando...';
        await new Promise(resolve => setTimeout(resolve, 500));
        window.location.href = '/';

      } catch (error) {
        console.error('Erro na autenticação:', error);
        
        // Limpar dados salvos
        localStorage.removeItem('github_code');
        localStorage.removeItem('github_state');

        // Exibir erro
        const errorDiv = document.getElementById('errorMessage');
        errorDiv.textContent = `Erro: ${error.message}`;
        errorDiv.classList.add('show');

        // Botão de voltar
        const retryBtn = document.createElement('button');
        retryBtn.textContent = 'Voltar para Login';
        retryBtn.style.cssText = `
          margin-top: 16px;
          padding: 10px 20px;
          background: #667eea;
          color: white;
          border: none;
          border-radius: 6px;
          cursor: pointer;
          font-size: 14px;
          transition: background 0.2s;
        `;
        retryBtn.onmouseover = () => retryBtn.style.background = '#764ba2';
        retryBtn.onmouseout = () => retryBtn.style.background = '#667eea';
        retryBtn.onclick = () => window.location.href = '/';
        
        document.querySelector('.container').appendChild(retryBtn);
      }
    })();
  </script>
</body>
</html>
